map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # API allows 200 MB uploads (Storage:MaxFileSizeMb) plus multipart overhead
    client_max_body_size 201m;

    root /usr/share/nginx/html;
    index index.html;

    # Svelte app (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API and the SignalR hub (/api/hubs/recordings)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # long-lived SignalR connections
    }
}